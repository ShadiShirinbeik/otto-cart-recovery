version: 2

models:
  - name: mart_sessions
    description: One row per session with behaviour, funnel and timing features
    columns:
      - name: session_id
        tests: [unique, not_null]
      - name: is_abandoned
        description: Added something to the cart but never ordered
      - name: hours_cart_to_order
        description: Hours from the first cart add to the first order
      - name: starts_with_cart_or_order
        description: First event is not a click (product was clicked before August 1st)
      - name: cart_in_last_days
        description: First cart add on Aug 27 or 28, the order may fall after the data period
      - name: buyer_type
        description: >
          browser (no cart), abandoner (cart but no order), quick_buyer (order within 1 hour of the cart),
          same_day_buyer (1-24 hours), slow_buyer (more than 24 hours), late_cart (cart on Aug 27-28, no order yet),
          other (order without a cart in the data period)
